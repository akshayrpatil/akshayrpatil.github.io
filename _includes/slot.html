<div class="slot">
  <div class="slot__bar">
    <span>{{ include.label | default: "drop image here" }}</span>
    <span>{{ include.kind | default: "IMG" }}</span>
  </div>
  <div class="slot__body">
    <div class="slot__split">
      <div class="slot__thumb"></div>
      <div class="slot__lines">
        <div class="slot__line slot__line--lead"></div>
        <div class="slot__line slot__line--a"></div>
        <div class="slot__line slot__line--b"></div>
        <div class="slot__cta"></div>
      </div>
    </div>
    <div class="slot__strip"><span></span><span></span><span></span></div>
  </div>
</div>
