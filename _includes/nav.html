<header class="site-nav">
  <div class="wrap site-nav__inner">
    <a class="site-nav__brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav__links">
      <a href="{{ '/' | relative_url }}#work" data-section="work">Work</a>
      <a href="{{ '/' | relative_url }}#strategy" data-section="strategy">Collab</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="is-active"{% endif %}>About</a>
      <a href="{{ site.social.resume_url | default: '#' }}"{% if site.social.resume_url and site.social.resume_url != "" %} download{% endif %}>Resume</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Toggle color theme">
      <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.5"/><path d="M8 1v1.5M8 13.5V15M15 8h-1.5M2.5 8H1M12.7 3.3l-1 1M4.3 11.7l-1 1M12.7 12.7l-1-1M4.3 4.3l-1-1"/></svg>
      <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M14 9.5A6 6 0 1 1 6.5 2 4.7 4.7 0 0 0 14 9.5Z"/></svg>
    </button>
  </div>
</header>
