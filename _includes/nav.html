<header class="site-nav">
  <div class="wrap site-nav__inner">
    <a class="site-nav__logo" href="{{ '/' | relative_url }}">{{ site.logo_initials }}</a>
    <nav class="site-nav__links">
      <a href="{{ '/' | relative_url }}#work">Work</a>
      <a href="{{ '/' | relative_url }}#about">About</a>
      {% if site.social.resume_url and site.social.resume_url != "" %}
      <a href="{{ site.social.resume_url }}" target="_blank" rel="noopener">Resume</a>
      {% endif %}
      <a class="site-nav__cta" href="mailto:{{ site.email }}">Say hello</a>
      <button class="theme-toggle" type="button" aria-label="Toggle color theme">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3.5"/><path d="M8 1v1.5M8 13.5V15M15 8h-1.5M2.5 8H1M12.7 3.3l-1 1M4.3 11.7l-1 1M12.7 12.7l-1-1M4.3 4.3l-1-1"/></svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 16 16" fill="currentColor"><path d="M14 9.5A6 6 0 1 1 6.5 2 4.7 4.7 0 0 0 14 9.5Z"/></svg>
      </button>
    </nav>
  </div>
</header>
