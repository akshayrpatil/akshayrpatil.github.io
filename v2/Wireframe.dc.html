<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;min-height:180px;background:var(--sf);border:1px solid var(--rule);display:flex;flex-direction:column;gap:0;overflow:hidden;position:relative">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--rule2);flex:0 0 auto">
    <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)">{{ label }}</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.09em;color:var(--ink3)">{{ kind }}</span>
  </div>
  <div style="flex:1 1 auto;padding:16px;display:flex;flex-direction:column;gap:10px;justify-content:center">
    <div style="display:flex;gap:10px;align-items:stretch">
      <div style="flex:0 0 34%;aspect-ratio:1/1;border:1px dashed var(--rule);background:var(--sf2);position:relative;overflow:hidden">
        <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,var(--rule2) 0 1px,transparent 1px 9px)"></div>
      </div>
      <div style="flex:1 1 auto;display:flex;flex-direction:column;gap:7px;justify-content:center">
        <div style="height:9px;width:78%;background:var(--rule)"></div>
        <div style="height:9px;width:52%;background:var(--rule2)"></div>
        <div style="height:9px;width:64%;background:var(--rule2)"></div>
        <div style="height:22px;width:44%;border:1px dashed var(--rule);margin-top:4px"></div>
      </div>
    </div>
    <div style="display:flex;gap:8px;padding-top:4px">
      <div style="flex:1;height:6px;background:var(--rule2)"></div>
      <div style="flex:1;height:6px;background:var(--rule2)"></div>
      <div style="flex:1;height:6px;background:var(--rule2)"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:260},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;drop image here&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;IMG&quot;,&quot;GIF&quot;,&quot;VIDEO&quot;,&quot;GALLERY&quot;,&quot;DIAGRAM&quot;],&quot;default&quot;:&quot;IMG&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      label: this.props.label ?? "drop image here",
      kind: this.props.kind ?? "IMG"
    };
  }
}
</script>
</body>
</html>
