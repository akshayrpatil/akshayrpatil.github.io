# Collaboration & strategy
strategy_quote: "Creativity isn't magic - it's maintenance, and it should pass on to the peers."
strategy_quote_subtext: "I also spend some of my time simplifying process and passing it on to others. Most days I lean on processes that let me get back into that creative space on purpose, with other people in the room."
strategy_items:
  - tag: "AOP Strategy"
    title: "Building the story leadership takes to the board"
    description: "I contribute new product ideas to Nykaa's Annual Operating Plan and investor presentations, and build the working prototypes that design and product leadership present to the board and C-suite. That includes producing a demo video in After Effects that lands a new initiative in under 90 seconds - because at that level, you get one shot to make an idea feel real."
    video: /assets/images/investerdeck.mp4
  - tag: "Cross-functional"
    title: "Co-creating features, not just designing them"
    description: "I work with PMs from the problem stage rather than the handoff stage - brainstorming together, contributing to the PRD, and shaping what a feature should be before anyone opens Figma. The features that came out of this are noticeably better than the ones that started as a brief."
    image: /assets/images/collab.png
  - tag: "Process & culture"
    title: "Self-initiated work alongside the roadmap"
    description: "Some of the work I'm proudest of wasn't assigned. Alongside product tasks and BAU, I pitch and design features that make the app better: Picture-in-Picture for NykaaPlay live shows, Live Quiz, several pieces of the PDP revamp, and the Routine Builder - which lifts both average basket size and order value."
    image: /assets/images/initiatives.png
  - tag: "Leadership"
    title: "Onboarding and mentoring designers into the system"
    description: "I've onboarded four designers onto the team. When someone moves on, I take their KT, hold their BAU until a replacement joins, then run the handover to the new designer and stay with them through their first tasks until they're comfortable in the system. It keeps work from stalling and gets people productive faster than documentation alone would."
    image: /assets/images/ktsessions.png

