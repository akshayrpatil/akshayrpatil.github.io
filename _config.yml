# About
about_excerpt: "I'm a Senior Product Designer working across consumer and B2B products, and what I enjoy most is the messy middle - taking a problem nobody has framed yet and turning it into something people can actually use. I sit close to PMs and engineers from discovery through ship, and I care about the system behind the product as much as the pixels on the screen."

