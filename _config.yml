# Collaboration & strategy
strategy_quote: "Creativity isn't magic — it's maintenance."
strategy_quote_subtext: "Sure, sometimes an idea drops into my brain at 2 AM. But most days I lean on processes that let me get back into that creative space on purpose, with other people in the room."
strategy_items:
  - tag: "Strategy initiative"
    title: "[Strategy initiative title]"
    description: "[Describe a strategic decision you drove — planning a design system rollout, defining a product vision, or influencing roadmap priorities.]"
  - tag: "Cross-functional"
    title: "[Cross-functional collaboration]"
    description: "[Describe how you partnered with PM, Engineering, or Research on a specific initiative, and what came out of it.]"
  - tag: "Process & culture"
    title: "[Team process or culture]"
    description: "[Describe a process you introduced — critiques, review rituals, documentation — and its impact on the team.]"
  - tag: "Leadership"
    title: "[Mentorship or leadership]"
    description: "[Describe how you grew, mentored, or led other designers or a broader design practice.]"

# About
about_excerpt: "I'm a Senior Product Designer working across consumer and B2B products, and what I enjoy most is the messy middle — taking a problem nobody has framed yet and turning it into something people can actually use. I sit close to PMs and engineers from discovery through ship, and I care about the system behind the product as much as the pixels on the screen."

