title: "Akshay R. Patil"
role: "Senior Product Designer"
location: "Mumbai"
site_title: "Akshay R. Patil | Mumbai-based Senior Product Designer with 6 years of experience"
tagline: "I've been shipping products for almost 6 years, my strengths are product thinking, AI-augmented workflows, and stakeholder management."
email: "akshayrp09@gmail.com"
description: >
  Mumbai-based Senior Product Designer with 6 years of experience -
  case studies, process, and work.
url: "https://akshayrpatil.github.io"
baseurl: "" # user site (akshayrpatil.github.io) is always served at root

logo_initials: "AP"

social:
  linkedin: "https://www.linkedin.com/in/akshaypatil09/"   # e.g. https://linkedin.com/in/yourname
  dribbble: ""
  twitter: ""
  resume_url: "" # link to a hosted PDF, or leave blank to hide

collections:
  work:
    output: true
    permalink: /work/:name/

defaults:
  - scope:
      path: ""
      type: "work"
    values:
      layout: "case-study"
  - scope:
      path: ""
    values:
      layout: "page"

markdown: kramdown
permalink: /:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .github
